<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <title>Netflix</title>
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">

                <a class="navbar-brand" href="#">
                    <img src="./assets/Netflix_Logo_RGB.png" width="100" class="d-inline-block align-text-top me-2"
                        alt="Netflix">
                </a>

                <div class="d-flex align-items-center ms-auto gap-2 d-lg-none">
                    <a class="nav-link text-light" href="#"><i class="bi bi-search"></i></a>
                    <a class="nav-link" href="#"><i class="bi bi-bell-fill text-light"></i></a>
                    <a class="nav-link dropdown-toggle text-light" href="#" role="button" data-bs-toggle="dropdown"
                        aria-expanded="false">
                        <img src="./assets/rabbit.png" width="40" alt="account icon">
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#">Action</a></li>
                        <li><a class="dropdown-item" href="#">Another action</a></li>
                        <li><a class="dropdown-item" href="#">Something else here</a></li>
                    </ul>
                </div>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNavDropdown">
                    <ul class="navbar-nav">

                        <li class="nav-item">
                            <a class="nav-link text-light" href="#">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active fw-bold text-light" aria-current="page" href="#">TV Shows</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-light" href="#">Movies</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-light" href="#">Recently Added</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-light" href="#">My List</a>
                        </li>
                    </ul>

                    <ul class="navbar-nav ms-auto align-items-center d-none d-lg-flex">
                        <li class="nav-item">
                            <a class="nav-link text-light" href="#"><i class="bi bi-search"></i></a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-light text-uppercase" href="#">Kids</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#"><i class="bi bi-bell-fill text-light"></i></a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle text-light" href="#" role="button"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                <img src="./assets/rabbit.png" width="50" class="d-inline-block" alt="account icon">
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="#">Action</a></li>
                                <li><a class="dropdown-item" href="#">Another action</a></li>
                                <li><a class="dropdown-item" href="#">Something else here</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section id="header-choice">
            <div class="container-fluid mt-4">
                <div class="d-flex align-items-center gap-5">
                    <h1 class="text-light">Tv Shows</h1>
                    <div class="dropdown">
                        <button
                            class="btn btn-secondary dropdown-toggle bg-black rounded-0 d-flex align-items-center justify-content-between"
                            type="button" style="width: 120px;" data-bs-toggle="dropdown" aria-expanded="false">
                            Genres
                        </button>
                        <ul class="dropdown-menu rounded-0">
                            <li><a class="dropdown-item" href="#">Action</a></li>
                            <li><a class="dropdown-item" href="#">Horror</a></li>
                            <li><a class="dropdown-item" href="#">Commedy</a></li>
                        </ul>
                    </div>

                    <div class="d-flex align-items-center text-light ms-auto">
                        <div class="border border-light pe-4 ps-4 pb-2 pt-2">
                           <i class="bi bi-text-left"></i>
                        </div>
                        <div class="border border-light pe-4 ps-4 pb-2 pt-2">
                            <i class="bi bi-grid-fill"></i>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer></footer>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
